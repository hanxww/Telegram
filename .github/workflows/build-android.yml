name: Android APK (upstream build check)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout source with all submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36 and matching NDK/CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses

          sdkmanager --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'platform-tools' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build standalone APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-parallel --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            :TMessagesProj_AppStandalone:assembleAfatStandalone \
            --stacktrace

      - name: Upload APK (testing only, not distributable)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-standalone-apk-UNREBRANDED
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
