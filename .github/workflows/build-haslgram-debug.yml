name: Build HaslGram Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      HASLGRAM_API_ID: ${{ secrets.HASLGRAM_API_ID }}
      HASLGRAM_API_HASH: ${{ secrets.HASLGRAM_API_HASH }}
      HASLGRAM_MTPROTO_HOST: ${{ vars.HASLGRAM_MTPROTO_HOST }}
      HASLGRAM_MTPROTO_PORT: ${{ vars.HASLGRAM_MTPROTO_PORT || '10443' }}
      HASLGRAM_FIREBASE_ENABLED: 'false'
      HASLGRAM_HUAWEI_ENABLED: 'false'
    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Validate private HaslGram build settings
        shell: bash
        run: |
          [[ "$HASLGRAM_API_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Set repository secret HASLGRAM_API_ID"; exit 1; }
          [[ "$HASLGRAM_API_HASH" =~ ^[A-Fa-f0-9]{32}$ ]] || { echo "Set repository secret HASLGRAM_API_HASH"; exit 1; }
          [[ "$HASLGRAM_MTPROTO_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Set repository variable HASLGRAM_MTPROTO_HOST to your gateway DNS name or IPv4"; exit 1; }
          [[ "$HASLGRAM_MTPROTO_PORT" =~ ^[0-9]+$ ]] || { echo "HASLGRAM_MTPROTO_PORT must be numeric"; exit 1; }
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK, NDK, and CMake
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build HaslGram debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-parallel --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            :TMessagesProj_AppStandalone:assembleAfatDebug --stacktrace
      - name: Upload test APK (not a production release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: haslgram-debug-test-apk
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
