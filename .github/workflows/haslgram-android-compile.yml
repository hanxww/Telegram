name: HaslGram Android compile-only check

on:
  workflow_dispatch:
  push:
    branches: [haslgram-teamgram]
    paths:
      - 'TMessagesProj/**'
      - 'TMessagesProj_AppStandalone/**'
      - 'gradle.properties'
      - 'build.gradle'
      - '.github/workflows/haslgram-android-compile.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      HASLGRAM_API_ID: '0'
      HASLGRAM_API_HASH: ''
      HASLGRAM_MTPROTO_HOST: '127.0.0.1'
      HASLGRAM_MTPROTO_PORT: '10443'
      HASLGRAM_FIREBASE_ENABLED: 'false'
      HASLGRAM_HUAWEI_ENABLED: 'false'
    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK, NDK, and CMake
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Compile HaslGram debug variant without deployment credentials
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-parallel --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            :TMessagesProj_AppStandalone:assembleAfatDebug --stacktrace
